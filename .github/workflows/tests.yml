name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # macOS runners are metered and may never be assigned (job cancelled with no
    # steps): report macOS, but do not let it turn the whole run red.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt6
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -e ".[qt,test]"
      - run: python -m pytest -q -p pytest_timeout
