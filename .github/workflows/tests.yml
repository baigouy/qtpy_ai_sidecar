name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs only when started by hand (Actions > Run workflow): its runner
        # was never assigned here, and a cancelled job marks every commit as failed.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest","macos-latest","ubuntu-latest"]' || '["windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt6
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -e ".[qt,test]"
      - run: python -m pytest -q -p pytest_timeout
