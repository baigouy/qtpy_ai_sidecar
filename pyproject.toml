[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qtpy-ai-sidecar"
version = "0.1.3"
description = "An embeddable Qt assistant connecting local models to application MCP servers"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{name = "Benoit Aigouy"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["qtpy>=2.4", "qtawesome>=1.3", "mcp>=1.12,<2", "httpx>=0.27", "platformdirs>=4", "keyring>=25"]

[project.optional-dependencies]
qt = ["PyQt6>=6.6"]
test = ["pytest>=8", "pytest-timeout", "pillow"]

[project.urls]
Homepage = "https://github.com/baigouy/qtpy_ai_sidecar"
Issues = "https://github.com/baigouy/qtpy_ai_sidecar/issues"

[project.scripts]
qtpy-ai-sidecar = "qtpy_ai_sidecar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 600

[tool.setuptools.package-data]
qtpy_ai_sidecar = ["resources/*.svg", "resources/*.jinja"]
