[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtpy-ai-sidecar"
version = "0.1.0"
description = "An embeddable Qt assistant connecting local models to application MCP servers"
requires-python = ">=3.10"
dependencies = ["qtpy>=2.4", "qtawesome>=1.3", "mcp>=1.12,<2", "httpx>=0.27", "platformdirs>=4", "keyring>=25"]

[project.optional-dependencies]
qt = ["PyQt6>=6.6"]
test = ["pytest>=8"]

[project.scripts]
qtpy-ai-sidecar = "qtpy_ai_sidecar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
